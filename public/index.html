<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Development page only (`npm start`): the plugin zip ships main.js and main.css,
         never this file. SeaTable's own styles and icon font, so the plugin looks as it
         does in a base. -->
    <link rel="stylesheet" type="text/css" href="media/seatable-ui.css" />
    <link rel="stylesheet" type="text/css" href="media/dtable-font.css" />
    <title>Online courses — development</title>
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #plugin-wrapper {
        height: calc(100% - 38px);
        width: 100%;
        display: flex;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div class="d-flex justify-content-end">
      <div id="language-dropdown"></div>
      <button class="btn btn-primary" id="plugin-controller">Open Plugin</button>
    </div>
    <div id="plugin-wrapper"></div>
  </body>
</html>
